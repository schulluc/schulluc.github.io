  <div class="viewport">
    <div class="stage-area">

  <script type="module">
    import { createProteinFold } from "./protein/engine.js?v=9";
    import PAB_AB from "./protein/structures/2pab-ab.js?v=9";
    import TIM_A from "./protein/structures/1tim-a.js?v=9";
    import { attachDiffusionScroll } from "./protein/diffusion.js?v=9";

    const params = new URLSearchParams(window.location.search);
    const period = params.has("period") ? Number(params.get("period")) : 16;
    const stage = document.getElementById("foldStage");
    const view = createProteinFold(stage, {
      mode: params.get("mode") || "lens",
      dragOrbit: false,
      touchOrbit: false,
      lensRadius: 0.30,
      asciiStyle: "hybrid",
      detail: 90,
      zoom: 1.09,
      lineWeight: 0.95,
      haloWidth: 4.2,
      depthFade: 0.0,
      period,
      tiltX: (18 * Math.PI) / 180,
      hatchHelix: true,
      slabStrand: true,
    });

    view.loadModel(PAB_AB);
    window.proteinFold = view;

    if (params.has("rotY")) {
      view.setRotation(Number(params.get("rotY")));
    }

    const initStop = params.has("stop") ? Number(params.get("stop")) : 0;
    window.proteinDiffusion = attachDiffusionScroll(view, {
      baseModel: PAB_AB,
      altModel: TIM_A,
      initialStop: initStop,
    });

    if (params.has("lens")) {
      const [lx, ly] = params.get("lens").split(",").map(Number);
      view.setPointer(lx, ly, true);
    }
  </script>
